name: Deploy to GitHub Pages

on:
  push:
    tags: ["v*", "V*"]
  workflow_dispatch:
    inputs:
      ref:
        description: '要部署的 git ref (tag/commit/branch); 留空 = 触发所在分支。用于补发历史 tag(用 master 上的新 workflow 构建旧 tag)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch 且填了 ref: 用新 workflow 构建指定 ref(补发历史 tag)
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref != '' && inputs.ref || github.ref }}
          fetch-depth: 0

      - name: Verify formal release tag on master HEAD
        shell: bash
        # 手动补发 (workflow_dispatch + ref) 不做 tag 门禁 —— 该路径本来就用于
        # 部署落后于 master 的历史 tag, 由操作者自行保证 ref 正确性
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"

          if ! printf '%s' "$TAG" | grep -Eq '^[Vv][0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "No formal release tag detected. Expected format: v1.2.3 or V1.2.3"
            exit 78
          fi

          # 门禁: tag 必须在 master 历史之内(防止从无关分支/落后分叉发版)。
          #   不再要求 tag == master 顶端 —— tag 打上后 master 继续前进是常态,
          #   发布产物 checkout 的是 tag 自身, master 新提交不会进入本次部署。
          #   注意用完整历史(fetch-depth=0)做祖先判定, 浅克隆会使 merge-base 失效。
          git fetch origin master
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "Tag is not on the master history. Skipping deployment."
            exit 78
          fi

          echo "Deploying release $TAG (tag=$(git rev-parse --short HEAD), master=$(git rev-parse --short origin/master))"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
