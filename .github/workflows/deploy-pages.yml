name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: >-
      github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify formal release tag on master HEAD
        shell: bash
        run: |
          git fetch origin master --depth=1

          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "No formal release tag detected. Expected format: v1.2.3"
            exit 78
          fi

          MASTER_SHA=$(git rev-parse origin/master)
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$MASTER_SHA" ]; then
            echo "Tag is not on the current master HEAD. Skipping deployment."
            exit 78
          fi

          echo "Deploying release $TAG from master"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
